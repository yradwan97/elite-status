stages:
  - build
  - deploy

variables:
  NODE_ENV: production

build_frontend:
  stage: build
  image: node:18

  only:
    - main

  script:
    - echo
    - npm ci

    - echo "Building React app..."
    - npm run build

  artifacts:
    paths:
      - build/
    expire_in: 1 hour

deploy_frontend:
  stage: deploy
  image: alpine:latest

  only:
    - main

  before_script:
    - apk add --no-cache openssh sshpass rsync

  script:
    - echo "🚀 Starting PRODUCTION deployment..."

    - |
      sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no \
      $SERVER_USER@$SERVER_HOST "rm -rf /var/www/elite-status/*"

    - |
      sshpass -p "$SERVER_PASSWORD" rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
      build/ $SERVER_USER@$SERVER_HOST:/var/www/elite-status/

    - |
      sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no \
      $SERVER_USER@$SERVER_HOST "
        echo '✅ Production deploy done'
        sudo systemctl restart nginx || true
      "
